# Server Port Configuration
server.port=${SERVER_PORT:8080}

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skill_gap_analyzer?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate & JPA Configuration
# NOTE: "update" is convenient for local development, but is NOT safe for
# production (it can silently drift from your real schema). For production,
# set this to "validate" and manage schema changes with a migration tool
# (Flyway/Liquibase) instead, using database/schema.sql as the baseline.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Directory (relative to the working directory, or an absolute path) where
# uploaded resumes are stored on disk.
app.upload.dir=${UPLOAD_DIR:uploads/resumes}

# JWT Configuration
# Hex encoded 256-bit key for HMAC-SHA. Override with the JWT_SECRET env var
# in any real deployment — never ship the default secret to production.
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS - comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Enable Swagger API docs custom path
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
